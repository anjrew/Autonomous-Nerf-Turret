<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 830" width="1000" height="830" role="img" aria-labelledby="title desc">
  <title id="title">Autonomous Nerf Turret system architecture</title>
  <desc id="desc">A camera and two controllers feed the serial driver, which talks over USB to an Arduino that drives the elevation stepper, azimuth servo, and trigger relay.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 Z" fill="#57606a"/>
    </marker>
    <style>
      .panel { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #d0d7de; stroke-width: 1.5; }
      .accent { fill: #ffffff; stroke: #2da44e; stroke-width: 2; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
      .muted { fill: #57606a; }
      .line { fill: none; stroke: #57606a; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .panel-title { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; fill: #57606a; text-transform: uppercase; }
      .node-title { font-size: 16px; font-weight: 600; }
      .node-sub { font-size: 12px; }
      .edge-label { font-size: 12.5px; fill: #57606a; }
    </style>
  </defs>

  <!-- Computer processes -->
  <rect class="panel" x="60" y="30" width="880" height="330" rx="12"/>
  <text class="label panel-title" x="86" y="63">Computer processes</text>

  <!-- Camera -->
  <rect class="node" x="640" y="76" width="140" height="44" rx="8"/>
  <text class="label node-title" x="710" y="103" text-anchor="middle" font-size="15">USB camera</text>
  <path class="line" d="M710,120 L710,154"/>

  <!-- Controllers -->
  <path class="node" d="M165,150 L335,150 L315,214 L145,214 Z"/>
  <text class="label node-title" x="238" y="187" text-anchor="middle">Game controller</text>

  <path class="node" d="M625,150 L795,150 L775,214 L605,214 Z"/>
  <text class="label node-title" x="698" y="187" text-anchor="middle">AI controller</text>

  <!-- Serial driver -->
  <rect class="node" x="400" y="268" width="200" height="64" rx="8"/>
  <text class="label node-title" x="500" y="296" text-anchor="middle">Serial driver</text>
  <text class="label muted node-sub" x="500" y="316" text-anchor="middle">command server</text>

  <path class="line" d="M240,214 L462,265"/>
  <path class="line" d="M696,214 L540,265"/>

  <!-- USB link -->
  <path class="line" d="M500,332 L500,466"/>
  <rect x="515" y="383" width="128" height="24" rx="6" fill="#f6f8fa"/>
  <text class="label edge-label" x="579" y="400" text-anchor="middle">Serial USB cable</text>

  <!-- Turret hardware -->
  <rect class="panel" x="60" y="380" width="880" height="420" rx="12"/>
  <text class="label panel-title" x="86" y="413">Turret hardware</text>

  <!-- Arduino -->
  <rect class="accent" x="410" y="450" width="180" height="110" rx="10"/>
  <text class="label node-title" x="500" y="500" text-anchor="middle">Arduino</text>
  <text class="label muted node-sub" x="500" y="522" text-anchor="middle">motor + relay control</text>

  <!-- Motors -->
  <ellipse cx="210" cy="620" rx="100" ry="62" fill="#ddf4ff" stroke="#0969da" stroke-width="1.5"/>
  <text class="label node-title" x="210" y="614" text-anchor="middle" font-size="15">Stepper motor</text>
  <text class="label muted node-sub" x="210" y="634" text-anchor="middle">elevation</text>

  <ellipse cx="790" cy="620" rx="100" ry="62" fill="#fff8c5" stroke="#bf8700" stroke-width="1.5"/>
  <text class="label node-title" x="790" y="614" text-anchor="middle" font-size="15">Servo motor</text>
  <text class="label muted node-sub" x="790" y="634" text-anchor="middle">azimuth</text>

  <!-- Relay -->
  <rect x="410" y="680" width="180" height="64" rx="10" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/>
  <text class="label node-title" x="500" y="706" text-anchor="middle" font-size="15">Shoot relay</text>
  <text class="label muted node-sub" x="500" y="725" text-anchor="middle">Nerf trigger</text>

  <!-- Control links -->
  <path class="line" d="M410,492 L297,571"/>
  <text class="label edge-label" x="304" y="519">step / dir</text>

  <path class="line" d="M590,492 L704,571"/>
  <text class="label edge-label" x="652" y="519">PWM</text>

  <path class="line" d="M500,560 L500,676"/>
  <rect x="512" y="608" width="58" height="24" rx="6" fill="#f6f8fa"/>
  <text class="label edge-label" x="541" y="625" text-anchor="middle">trigger</text>
</svg>
